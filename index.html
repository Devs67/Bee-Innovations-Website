<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bee Innovations — Create What You Imagine</title>
<meta name="description" content="Bee Innovations gives schools the curriculum, the lab, and the trained teacher to turn every child's imagination into something they can actually build.">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- Launch page: the site's true entry point. Every fresh visit and every
     reload lands here. Clicking Launch plays the 3D intro at
     experience/index.html, which hands off to home.html afterward. -->
<div class="launch-gate" id="launchGate">
  <div class="launch-gate-content">
    <span class="launch-gate-eyebrow">Bee Innovations</span>
    <h2 class="launch-gate-title">Ready to see an idea<br>become something real?</h2>
    <button type="button" class="launch-btn" id="launchBtn">Launch →</button>
  </div>
</div>
<script>
  document.getElementById('launchBtn').addEventListener('click', function () {
    window.location.href = 'experience/index.html';
  });
</script>

</body>
</html>
